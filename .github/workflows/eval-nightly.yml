name: eval-nightly

# The full evaluation spends LLM quota, so it runs once a night against staging
# rather than on every pull request. Retrieval metrics run in ci.yml instead.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: retrieval or full
        default: full

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run the evaluation
        env:
          APP_ENV: prod
          ALLOW_DEV_ANON: "false"
          VECTOR_BACKEND: qdrant
          QDRANT_URL: ${{ secrets.QDRANT_URL_STAGING }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY_STAGING }}
          ARTIFACT_BACKEND: hf
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO_STAGING }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TENANTS_JSON: ${{ secrets.TENANTS_JSON_STAGING }}
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.models
        run: |
          python -m emrag.eval.run_eval \
            --mode "${{ github.event.inputs.mode || 'full' }}" \
            --golden tests/golden/v1.jsonl \
            --report var/eval-report.json \
            --min-citation-accuracy 1.0 \
            --min-faithfulness 0.85 \
            --min-recall 0.85 \
            --max-p95-ms 5000

      - name: Summarise
        if: always()
        run: |
          if [ -f var/eval-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = json.loads(pathlib.Path("var/eval-report.json").read_text())
          print(f"## Evaluation ({report['mode']}, {report['items']} items)\n")
          print("| metric | value |")
          print("|--------|-------|")
          for name, value in report["metrics"].items():
              print(f"| {name} | {value} |")
          latency = report["latency"]
          print(f"\np50 {latency['p50_ms']} ms, p95 {latency['p95_ms']} ms\n")
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: var/eval-report.json
          if-no-files-found: ignore
