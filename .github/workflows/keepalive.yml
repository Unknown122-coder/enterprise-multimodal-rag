name: keepalive

# Free tiers idle out: a Hugging Face Space sleeps after prolonged inactivity and
# a Qdrant free cluster can be suspended. A periodic ping keeps both warm and
# turns an outage into a failed workflow run rather than a surprise at query time.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Ping the API and the vector store
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          APP_ENV: dev
          ARTIFACT_BACKEND: local
          EMBED_BACKEND: deterministic
        run: |
          python scripts/keepalive.py --url "${{ vars.PUBLIC_API_URL }}" --timeout 90
