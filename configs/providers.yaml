# Free-tier provider catalogue.
#
# Model names were verified against real accounts on 2026-10-27 with
# scripts/check_setup.py: every model below accepted a request that day. The
# blueprint's original Llama and Gemini 2.5 entries no longer exist for new
# accounts, which is the normal state of affairs; expect to revisit this file.
#
# LIMITS ARE INDICATIVE. Verify each in the provider console and edit here only;
# nothing else in the system reads a rate limit. tpd: null means no published
# daily token cap.
#
# tiers: fast (volume answers) | quality (best answers) | rewrite | repair |
#        vision (figure captioning) | judge (evaluation)
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    kind: openai_compatible
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    kind: gemini

models:
  # ---- fast tier: the volume path, ordered by latency ----------------------
  - key: groq/qwen3.8-27b
    provider: groq
    model: qwen/qwen3.8-27b
    tiers: [fast, rewrite, repair]
    priority: 10
    limits: { rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000 }  # tpm read from headers 2026-10-27
    capabilities: { json_schema: true, vision: false, context: 131072 }
    # Do not send reasoning_effort: on this model it turns thinking on.

  - key: groq/gpt-oss-20b
    provider: groq
    model: openai/gpt-oss-20b
    tiers: [fast, rewrite, repair]
    priority: 20
    limits: { rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000 }
    capabilities: { json_schema: true, vision: false, context: 131072 }
    # A reasoning model: without this it spends most of the output budget
    # thinking and can return empty content on short calls.
    params: { reasoning_effort: low }

  # Gemini limits below were read from aistudio.google.com/rate-limit on
  # 2026-10-27 for this account's free tier.
  - key: gemini/flash-lite
    provider: gemini
    model: gemini-3.5-flash-lite
    tiers: [fast, rewrite, repair, judge, vision]
    priority: 30
    # Leads the vision tier: 500 requests a day, no thinking tokens, and it
    # captioned three figures per request without truncation on 2026-10-27.
    limits: { rpm: 15, tpm: 250000, rpd: 500, tpd: null }
    capabilities: { json_schema: true, vision: true, context: 1048576 }

  - key: gemini/flash-lite-3.1
    provider: gemini
    model: gemini-3.1-flash-lite
    tiers: [fast, rewrite, repair, judge]
    priority: 40
    limits: { rpm: 15, tpm: 250000, rpd: 500, tpd: null }
    # Vision not yet verified on this model, so it is not in the vision tier.
    capabilities: { json_schema: true, vision: false, context: 1048576 }

  - key: gemini/gemma-26b
    provider: gemini
    model: gemma-4-26b-a4b-it
    tiers: [fast, rewrite, repair]
    priority: 50
    # By far the largest daily allowance on the free tier. 16K tokens per
    # minute caps it at roughly four answers a minute, so it is the deep
    # fallback rather than the first choice. Verified with the citation schema;
    # the 31B sibling took over a minute per call and is left out.
    limits: { rpm: 30, tpm: 16000, rpd: 14400, tpd: null }
    capabilities: { json_schema: true, vision: false, context: 131072 }

  # ---- quality tier: the best answer, with the smallest budgets --------------
  - key: groq/gpt-oss-120b
    provider: groq
    model: openai/gpt-oss-120b
    tiers: [quality]
    priority: 10
    limits: { rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000 }
    capabilities: { json_schema: true, vision: false, context: 131072 }
    params: { reasoning_effort: low }

  - key: gemini/flash
    provider: gemini
    model: gemini-3.5-flash
    tiers: [quality, vision]
    priority: 60
    # The console has no 3.5 Flash row: calls to it are metered under
    # "Gemini 3.6 Flash", which allows only 20 requests a day. A fallback for
    # the quality tier and for figure captioning, not a volume path, hence the
    # lowest priority in the catalogue.
    limits: { rpm: 5, tpm: 250000, rpd: 20, tpd: null }
    capabilities: { json_schema: true, vision: true, context: 1048576 }
    # This model thinks by default and the thoughts count against
    # maxOutputTokens: measured 2026-10-27, about 550 thought tokens per
    # three-figure caption batch, which truncated the JSON. Low turns it off.
    params: { thinkingConfig: { thinkingLevel: low } }

routing:
  # Reserve a fraction of each daily budget so a batch job cannot starve
  # interactive queries.
  daily_reserve_ratio: 0.10
  max_attempts_per_tier: 3
  cooldown_seconds: 60
  request_timeout_s: 30
  connect_timeout_s: 5
