[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emrag"
version = "1.0.0"
description = "Enterprise Multimodal RAG System with verifiable citations"
readme = "README.md"
# Target runtime is 3.11 (see Dockerfile); 3.12 is allowed so local dev works
# on either interpreter.
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<0.29",
  "tiktoken>=0.8,<0.9",
  "rapidfuzz>=3.10,<4",
  "structlog>=24.4,<25",
  "PyYAML>=6.0,<7",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
# LlamaIndex is NOT a runtime dependency; see docs/adr/0007-framework-deviation.md.
# This extra exists only for emrag.llm.llamaindex_adapter, which lets LlamaIndex
# components route through the quota-aware LLM router instead of calling a
# provider directly.
llamaindex = ["llama-index-core>=0.12,<0.15"]
tracing = [
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
api = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "python-multipart>=0.0.12,<0.1",
  "slowapi>=0.1.9,<0.2",
  "PyJWT[crypto]>=2.9,<3",
  "argon2-cffi>=23.1,<24",
  "filetype>=1.2,<2",
  "qdrant-client>=1.12,<2",
  "fastembed>=0.4.2,<0.5",
  "PyMuPDF>=1.24,<1.26",
  "pikepdf>=9.3,<10",
  # fastembed 0.4.x requires pillow<11; widening this breaks the image build.
  "pillow>=10.3,<11",
  "huggingface-hub>=0.26,<1",
  "pyarrow>=17,<19",
  "pandas>=2.2,<3",
]
ingest = [
  "emrag[api]",
  "docling>=2.14,<3",
  "pdfplumber>=0.11,<0.12",
  "rapidocr-onnxruntime>=1.3,<2",
]
pinecone = ["pinecone>=5.3,<6"]
ui = ["streamlit>=1.39,<2"]
eval = ["pandas>=2.2,<3", "tabulate>=0.9,<1"]
dev = [
  "emrag[api,eval]",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5.0,<6",
  "respx>=0.21,<0.22",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "black>=24.10,<25",
  "types-PyYAML",
]

[project.scripts]
emrag-eval = "emrag.eval.run_eval:main"
emrag-ingest = "emrag.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emrag = ["llm/prompts/*.md", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Notebook sources are percent-format cells with top-level await; they are
# generated into .ipynb and are not importable modules.
extend-exclude = ["notebooks", ".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "BLE", "RUF"]
ignore = ["B008", "N818", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["emrag"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["emrag.core.*", "emrag.citation.*", "emrag.security.*", "emrag.llm.*"]
strict = true

# The LlamaIndex adapter subclasses and decorates types from an optional
# dependency that is not installed in CI, so its base classes resolve to Any.
# The module is exercised only when llama-index-core is present.
[[tool.mypy.overrides]]
module = ["emrag.llm.llamaindex_adapter"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "llm: hits a real LLM provider (skipped in CI)",
  "integration: needs a local Qdrant or network",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  # Local in-memory Qdrant has no payload indexes; the adapter creates them
  # anyway so the same code path runs against a real cluster.
  "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.coverage.run]
source = ["src/emrag"]
